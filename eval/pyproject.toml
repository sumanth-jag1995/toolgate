[project]
name = "toolgate-eval"
version = "0.1.0"
description = "Toolgate evaluation harness: measures canary leakage by a servicing agent"
requires-python = ">=3.12"
dependencies = [
    "servicing-agent",
    "toolgate-pin",
    "toolgate-gateway",
    "mock-enterprise",
    "httpx>=0.27",
    "uvicorn>=0.54.0",
    "starlette>=1.8.0",
    "pyyaml>=6",
    "asyncpg>=0.32.0",
]

[project.scripts]
toolgate-eval = "toolgate_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate_eval"]

[tool.uv.sources]
servicing-agent = { workspace = true }
toolgate-pin = { workspace = true }
toolgate-gateway = { workspace = true }
mock-enterprise = { workspace = true }
