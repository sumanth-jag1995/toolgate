[project]
name = "toolgate-pin"
version = "0.1.0"
description = "MCP tool pinning: canonical hashing, lockfile and drift detection for tool definitions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "rfc8785"]

[project.optional-dependencies]
classifier = ["onnxruntime", "tokenizers", "huggingface-hub"]
otel = ["opentelemetry-api"]

[project.scripts]
toolgate-pin = "toolgate_pin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate_pin"]
include = [
    "src/toolgate_pin/**/*.py",
    "src/toolgate_pin/corpus/**/*.json",
    "src/toolgate_pin/corpus/**/*.md",
]
