[project]
name = "toolgate-gateway"
version = "0.1.0"
description = "Toolgate gateway: authenticated MCP proxy with per-agent allowlists, pins, audit and tracing"
requires-python = ">=3.12"
dependencies = [
    "toolgate-pin",
    "pydantic-settings>=2.4",
    "PyYAML>=6",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "mcp>=1.30,<2",
]

[project.scripts]
toolgate-gateway = "toolgate_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate_gateway"]

[tool.uv.sources]
toolgate-pin = { workspace = true }
