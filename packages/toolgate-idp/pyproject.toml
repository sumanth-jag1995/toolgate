[project]
name = "toolgate-idp"
version = "0.1.0"
description = "Shared identity-provider claim rules for toolgate (Keycloak and Cognito tokens)"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pyjwt[crypto]>=2.15.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate_idp"]
