[project]
name = "servicing-agent"
version = "0.1.0"
description = "Reusable LangGraph servicing agent and evaluation harness for Toolgate"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
bedrock = [
    "langchain-aws>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicing_agent"]
