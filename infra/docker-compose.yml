name: toolgate

x-mcp-server: &mcp-server
  build:
    context: ..
    dockerfile: services/mcp-servers/Dockerfile
  env_file: ../.env
  environment:
    MOCK_API_URL: http://mock-api:8000
    TOKEN_URL: http://keycloak:8080/realms/toolgate/protocol/openid-connect/token
    JWT_ISSUER: http://localhost:8080/realms/toolgate
    JWKS_URL: http://keycloak:8080/realms/toolgate/protocol/openid-connect/certs
  depends_on:
    mock-api:
      condition: service_healthy
    keycloak:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    environment:
      POSTGRES_DB: toolgate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toolgate"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    env_file: ../.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    # KC_BOOTSTRAP_ADMIN_PASSWORD is set from KEYCLOAK_ADMIN_PASSWORD below
    entrypoint:
      - /bin/sh
      - -c
      - export KC_BOOTSTRAP_ADMIN_PASSWORD="$$KEYCLOAK_ADMIN_PASSWORD"; exec /opt/keycloak/bin/kc.sh "$$@"
      - kc
    volumes:
      - ./keycloak/generated:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      # No curl in the image: speak HTTP to the management port (9000) over /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mock-api:
    build:
      context: ..
      dockerfile: services/mock-enterprise/Dockerfile
    env_file: ../.env
    environment:
      JWT_ISSUER: http://localhost:8080/realms/toolgate
      JWKS_URL: http://keycloak:8080/realms/toolgate/protocol/openid-connect/certs
    command:
      - /bin/sh
      - -c
      - >-
        export DATABASE_URL="postgresql+asyncpg://postgres:$$POSTGRES_PASSWORD@postgres:5432/toolgate" &&
        python -m mock_enterprise.seed --reset &&
        exec python -m mock_enterprise.app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()
      interval: 3s
      timeout: 3s
      retries: 20

  core-read:
    <<: *mcp-server
    command:
      - /bin/sh
      - -c
      - export CLIENT_ID=core-read CLIENT_SECRET="$$CORE_READ_CLIENT_SECRET"; exec python -m toolgate_mcp_servers.core_read
    ports:
      - "127.0.0.1:8101:8101"

  core-write:
    <<: *mcp-server
    command:
      - /bin/sh
      - -c
      - export CLIENT_ID=core-write CLIENT_SECRET="$$CORE_WRITE_CLIENT_SECRET"; exec python -m toolgate_mcp_servers.core_write
    ports:
      - "127.0.0.1:8102:8102"

  comms:
    <<: *mcp-server
    command:
      - /bin/sh
      - -c
      - export CLIENT_ID=comms CLIENT_SECRET="$$COMMS_CLIENT_SECRET"; exec python -m toolgate_mcp_servers.comms
    ports:
      - "127.0.0.1:8103:8103"
