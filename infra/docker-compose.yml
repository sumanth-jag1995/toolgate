name: toolgate

# Secrets are interpolated per service from ../.env (run compose with `--env-file ../.env`),
# so each container only receives the secrets it needs.
x-mcp-env: &mcp-env
  MOCK_API_URL: http://mock-api:8000
  TOKEN_URL: http://keycloak:8080/realms/toolgate/protocol/openid-connect/token
  JWT_ISSUER: http://localhost:8080/realms/toolgate
  JWKS_URL: http://keycloak:8080/realms/toolgate/protocol/openid-connect/certs

x-mcp-server: &mcp-server
  build:
    context: ..
    dockerfile: services/mcp-servers/Dockerfile
  depends_on:
    mock-api:
      condition: service_healthy
    keycloak:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: toolgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen_dev_env.py}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toolgate"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/gen_dev_env.py}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/generated:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      # No curl in the image: speak HTTP to the management port (9000) over /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mock-api:
    build:
      context: ..
      dockerfile: services/mock-enterprise/Dockerfile
    environment:
      JWT_ISSUER: http://localhost:8080/realms/toolgate
      JWKS_URL: http://keycloak:8080/realms/toolgate/protocol/openid-connect/certs
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/toolgate
    command:
      - /bin/sh
      - -c
      - python -m mock_enterprise.seed --reset && exec python -m mock_enterprise.app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()
      interval: 3s
      timeout: 3s
      retries: 20

  core-read:
    <<: *mcp-server
    environment:
      <<: *mcp-env
      CLIENT_ID: core-read
      CLIENT_SECRET: ${CORE_READ_CLIENT_SECRET:?run scripts/gen_dev_env.py}
    command: ["python", "-m", "toolgate_mcp_servers.core_read"]
    ports:
      - "127.0.0.1:8101:8101"

  core-write:
    <<: *mcp-server
    environment:
      <<: *mcp-env
      CLIENT_ID: core-write
      CLIENT_SECRET: ${CORE_WRITE_CLIENT_SECRET:?run scripts/gen_dev_env.py}
    command: ["python", "-m", "toolgate_mcp_servers.core_write"]
    ports:
      - "127.0.0.1:8102:8102"

  comms:
    <<: *mcp-server
    environment:
      <<: *mcp-env
      CLIENT_ID: comms
      CLIENT_SECRET: ${COMMS_CLIENT_SECRET:?run scripts/gen_dev_env.py}
    command: ["python", "-m", "toolgate_mcp_servers.comms"]
    ports:
      - "127.0.0.1:8103:8103"
