[project]
name = "toolgate-mcp-servers"
version = "0.1.0"
description = "MCP servers fronting the mock enterprise API"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mock-enterprise"]

[tool.uv.sources]
mock-enterprise = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate_mcp_servers"]
