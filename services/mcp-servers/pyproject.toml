[project]
name = "toolgate-mcp-servers"
version = "0.1.0"
description = "MCP servers fronting the mock enterprise API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.12,<2",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "toolgate-idp",
]

[dependency-groups]
dev = ["mock-enterprise"]

[tool.uv.sources]
toolgate-idp = { workspace = true }
mock-enterprise = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate_mcp_servers"]
