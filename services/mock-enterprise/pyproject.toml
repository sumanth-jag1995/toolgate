[project]
name = "mock-enterprise"
version = "0.1.0"
description = "Mock enterprise system (synthetic data) for Toolgate"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "pydantic-settings",
    "faker",
    "fastapi>=0.143.3",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_enterprise"]
