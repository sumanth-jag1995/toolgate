[project]
name = "toolgate"
version = "0.1.0"
description = "Toolgate: MCP security gateway portfolio project"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pre-commit",
    "testcontainers[postgres]",
    "httpx>=0.28.1",
    "opentelemetry-sdk>=1.45.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/*", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "services/mock-enterprise/tests", "services/mcp-servers/tests", "packages/toolgate-pin/tests", "packages/toolgate-gateway/tests", "packages/servicing-agent/tests", "eval/tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: builds artifacts or shells out to uv (deselect with -m 'not slow')",
    "integration: needs the live compose stack; skips when it is unreachable (deselect with -m 'not integration')",
]
