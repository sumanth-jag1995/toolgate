[project]
name = "toolgate"
version = "0.1.0"
description = "Toolgate: MCP security gateway portfolio project"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pre-commit",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
